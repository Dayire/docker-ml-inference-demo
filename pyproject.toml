[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-text-inference-demo"
version = "0.1.0"
description = "Small CPU model for a Docker teaching demo"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
